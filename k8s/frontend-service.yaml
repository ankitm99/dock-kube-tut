apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  labels:
    app: frontend-service
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  replicas: 1                   # scale up in prod values
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      containers:
        - name: frontend-service
          image: 707360336863.dkr.ecr.us-east-1.amazonaws.com/frontend-service:frontend-v2
          imagePullPolicy: IfNotPresent     # use Always for ECR
          ports:
            - containerPort: 80
          # Liveness probe: is nginx still running?
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness probe: is the app ready to receive traffic?
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: frontend-service
spec:
  selector:
    app: frontend-service
  ports:
    - protocol: TCP
      port: 80          # cluster-internal port
      targetPort: 80    # nginx container port
  type: ClusterIP       # exposed via Ingress, not directly
