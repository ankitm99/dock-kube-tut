server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://product-service:8082}
          predicates:
            - Path=/products/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://order-service:8081}
          predicates:
            - Path=/orders/**

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
