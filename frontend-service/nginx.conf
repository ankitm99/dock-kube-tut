server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React client-side routing — always return index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* → API Gateway (or Ingress in prod)
    # Used only when the container itself needs to forward requests.
    # In K8s prod the browser calls the Ingress directly via VITE_API_BASE_URL.
    location /api/ {
        proxy_pass          http://api-gateway:8080/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Health check endpoint (used by K8s liveness/readiness probes)
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
