server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React client-side routing — always return index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /actuator/health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Health check endpoint (used by K8s liveness/readiness probes)
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
